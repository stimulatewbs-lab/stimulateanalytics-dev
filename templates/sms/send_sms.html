{% extends 'base.html' %}

{% block page_title %}
Send SMS
{% endblock %}

{% block content %}

<div class="bg-white dark:bg-[#172033] rounded-xl p-6 max-w-3xl">

    <h2 class="text-xl font-bold mb-6">
        Send SMS
    </h2>

    <form method="post">

        {% csrf_token %}

        <div class="mb-4">
            <label>Campaign</label>
            {{ form.campaign }}
        </div>

        <div class="mb-4">
            <label>Contact</label>
            {{ form.contact }}
        </div>

        <div class="mb-4">
            <label>Message</label>
            {{ form.message }}
        </div>

        <button
            type="submit"
            class="
                bg-primary
                text-white
                px-4
                py-2
                rounded-lg
            "
        >
            Send Message
        </button>

    </form>

</div>

{% endblock %}
