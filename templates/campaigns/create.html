{% extends 'base.html' %}

{% block title %}Create Campaign{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow">

    <h1 class="text-2xl font-bold mb-6 dark:text-white">
        Create Campaign
    </h1>

    <form method="POST">

        {% csrf_token %}

        <div class="space-y-4">
            {{ form.as_p }}
        </div>

        <button type="submit"
                class="mt-6 bg-primary text-white px-6 py-2 rounded-lg">
            Save Campaign
        </button>

    </form>

</div>

{% endblock %}
