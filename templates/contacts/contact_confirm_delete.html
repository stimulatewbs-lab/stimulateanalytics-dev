{% extends 'base.html' %}

{% block page_title %}
Delete Contact
{% endblock %}

{% block content %}

<div class="bg-white dark:bg-[#172033] rounded-xl p-6 max-w-xl">

    <h2 class="text-xl font-bold mb-6">
        Delete Contact
    </h2>

    <p class="mb-6">

        Are you sure you want to delete

        <strong>
            {{ contact.first_name }}
            {{ contact.last_name }}
        </strong> ?

    </p>

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="
                bg-red-600
                text-white
                px-4
                py-2
                rounded-lg
            "
        >
            Delete
        </button>

    </form>

</div>

{% endblock %}
